# Fase 2 — respaldo y restauración físicos. Ejecutar desde esta carpeta: docker compose up -d
# Postgres 17: trae respaldo incremental nativo (pg_basebackup --incremental + pg_combinebackup).
# Nombre de proyecto, contenedor, volúmenes y puerto propios para convivir con Fase 1.
name: proyectofase2

services:
  db:
    image: postgres:17-alpine
    container_name: olimpiadas-postgres-f2
    restart: unless-stopped
    # summarize_wal=on es lo que habilita los respaldos incrementales.
    command: ["postgres", "-c", "summarize_wal=on", "-c", "wal_level=replica", "-c", "max_wal_senders=5"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Almacenamiento persistente: datos y respaldos en volúmenes SEPARADOS.
      # Borrar/restaurar pgdata nunca toca los respaldos.
      - olimpiadas_f2_pgdata:/var/lib/postgresql/data
      - olimpiadas_f2_backups:/backups
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./cargas:/cargas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  olimpiadas_f2_pgdata:
  olimpiadas_f2_backups:
